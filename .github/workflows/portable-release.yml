name: Windows portable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run JavaScript and Python tests
        run: |
          set -euo pipefail
          npm test
          dotnet run --project native/CodeWalkerBridge.Tests/CodeWalkerBridge.Tests.csproj -c Release
          python3 -m unittest discover -s tests -v
      - name: Build Windows x64 portable
        run: npm run package:windows
      - name: Test clothing pack project and variation workflow
        run: |
          if command -v google-chrome >/dev/null; then
            export CHROMIUM_PATH="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium
          fi
          npm run test:pack:browser
      - name: Retain pack workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-workflow-evidence
          path: |
            .test-output/pack-manager.png
            .test-output/pack-browser-results.json
          if-no-files-found: ignore
      - name: Retain portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Godoy-3D-Modding-Windows-x64-Portable
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  windows-smoke:
    needs: portable
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: Godoy-3D-Modding-Windows-x64-Portable
          path: portable-artifacts
      - name: Launch and test actual packaged Windows executable
        shell: pwsh
        run: |
          $archive = Get-ChildItem portable-artifacts/*.zip | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'godoy-portable'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination
          $executable = Get-ChildItem $destination -Filter Godoy3DModding.exe -Recurse | Select-Object -First 1
          if (-not $executable) { throw 'Portable executable missing' }
          $env:GODOY_DESKTOP_EXE = $executable.FullName
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-test-evidence
          path: .test-output/desktop-win32.*
          include-hidden-files: true
          if-no-files-found: warn

  publish:
    needs: [portable, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: Godoy-3D-Modding-Windows-x64-Portable
          path: release
      - name: Publish beta release only after Windows smoke passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo 'Tag must match package.json version.' >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip release/*.sha256 --clobber
          else
            gh release create "$TAG" release/*.zip release/*.sha256 \
              --verify-tag --prerelease --title "Godoy 3D Modding ${VERSION} beta" \
              --notes-file docs/release-notes.md
          fi
